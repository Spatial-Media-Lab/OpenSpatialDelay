name: Build Windows VST3

on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger

jobs:
  build-windows:
    name: Windows x64 VST3
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive  # JUCE is a git submodule
          lfs: true              # 5 HRTF SOFA files are LFS-tracked (~58 MB)

      - name: Install zlib via vcpkg
        run: vcpkg install zlib:x64-windows-static

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build Release
        run: cmake --build build --config Release

      - name: Upload Windows VST3
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: OpenSpatialDelay-Windows-VST3
          path: build/OpenSpatialDelay_artefacts/Release/VST3/
          retention-days: 90

      # ---------------------------------------------------------------
      # SignPath code signing (free for open-source projects)
      # Uncomment after applying at: https://signpath.io/solutions/open-source-community
      # Requires SIGNPATH_API_TOKEN secret and SignPath project/policy configured.
