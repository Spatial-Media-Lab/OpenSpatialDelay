<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenSpatialDelay — Concept A: Observatory</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300;1,9..40,400&family=JetBrains+Mono:wght@300;400;500;600&display=swap');

  /* ================================================================
     OKLCH Color Palette — Observatory / Planetarium
     ================================================================ */
  :root {
    --bg-void:        oklch(8% 0.015 260);
    --bg-panel:       oklch(12% 0.012 260);
    --bg-header:      oklch(10% 0.014 260);
    --bg-recessed:    oklch(6% 0.012 260);
    --bg-well:        oklch(7% 0.013 260);
    --border-subtle:  oklch(20% 0.015 260);
    --border-dim:     oklch(16% 0.012 260);
    --ring-glow:      oklch(22% 0.02 260);
    --accent-stellar: oklch(85% 0.12 240);
    --accent-stellar-dim: oklch(60% 0.08 240);
    --accent-violet:  oklch(55% 0.18 290);
    --accent-amber:   oklch(78% 0.14 70);
    --text-primary:   oklch(90% 0.01 260);
    --text-secondary: oklch(60% 0.02 260);
    --text-dim:       oklch(40% 0.015 260);
    --text-etched:    oklch(35% 0.012 260);
    --plugin-w: 820px;
    --plugin-h: 580px;
    --header-h: 52px;
    --right-panel-w: 264px;
    --bottom-panel-h: 150px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: oklch(5% 0.01 260);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'DM Sans', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ================================================================
     Plugin Frame
     ================================================================ */
  .plugin {
    width: var(--plugin-w);
    height: var(--plugin-h);
    background: var(--bg-void);
    border-radius: 6px;
    overflow: hidden;
    display: grid;
    grid-template-rows: var(--header-h) 1fr var(--bottom-panel-h);
    grid-template-columns: 1fr var(--right-panel-w);
    box-shadow:
      0 0 0 1px oklch(18% 0.02 260),
      0 24px 80px rgba(0,0,0,0.6),
      0 4px 16px rgba(0,0,0,0.4);
  }

  /* ================================================================
     HEADER
     ================================================================ */
  .header {
    grid-column: 1 / -1;
    grid-row: 1;
    background: var(--bg-header);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 8px;
    position: relative;
    z-index: 10;
  }

  .header::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, oklch(85% 0.08 240 / 0.3) 20%, oklch(85% 0.12 240 / 0.5) 50%, oklch(85% 0.08 240 / 0.3) 80%, transparent 100%);
  }

  .sml-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 0.15em;
    color: var(--accent-stellar);
    border: 1px solid oklch(85% 0.08 240 / 0.35);
    border-radius: 3px;
    padding: 2px 5px 1px;
    line-height: 1;
    text-transform: uppercase;
    flex-shrink: 0;
  }

  .plugin-title {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .version-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--text-dim);
    margin-left: -2px;
  }

  .header-spacer { flex: 1; }

  .header-control {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    flex-shrink: 0;
  }

  .header-control-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 7.5px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding-left: 2px;
  }

  .header-dropdown {
    background: var(--bg-recessed);
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    color: var(--text-secondary);
    font-family: 'DM Sans', sans-serif;
    font-size: 10.5px;
    padding: 3px 20px 3px 7px;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    height: 22px;
    background-image: url("data:image/svg+xml,%3Csvg width='8' height='5' viewBox='0 0 8 5' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L4 4L7 1' stroke='%23667788' stroke-width='1' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 6px center;
    transition: border-color 0.15s ease;
  }

  .header-dropdown:hover { border-color: oklch(30% 0.02 260); }
  .header-dropdown:focus { outline: none; border-color: var(--accent-stellar-dim); }

  .preset-nav {
    display: flex;
    align-items: flex-end;
    gap: 2px;
  }

  .preset-nav-btn {
    background: var(--bg-recessed);
    border: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    font-size: 11px;
    width: 20px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 3px;
    transition: background 0.15s, border-color 0.15s;
    font-family: 'DM Sans', sans-serif;
  }

  .preset-nav-btn:hover { background: oklch(14% 0.015 260); }

  .preset-save-btn {
    background: var(--bg-recessed);
    border: 1px solid var(--border-subtle);
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.08em;
    padding: 0 6px;
    height: 22px;
    border-radius: 3px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.15s ease;
  }

  .preset-save-btn:hover { border-color: var(--accent-stellar-dim); color: var(--text-secondary); }

  /* ================================================================
     SPATIAL MAP
     ================================================================ */
  .spatial-map-container {
    grid-column: 1;
    grid-row: 2;
    position: relative;
    overflow: hidden;
    border-right: 1px solid var(--border-dim);
    border-bottom: 1px solid var(--border-dim);
  }

  .spatial-map {
    width: 100%;
    height: 100%;
    position: relative;
  }

  .spatial-map canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
  }

  .map-noise {
    position: absolute;
    inset: 0;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 256px 256px;
    pointer-events: none;
    mix-blend-mode: screen;
  }

  .map-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .cardinal {
    position: absolute;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.2em;
    color: var(--text-etched);
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
  }

  .tap-dots {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .tap-dot {
    position: absolute;
    pointer-events: all;
    cursor: pointer;
    transform: translate(-50%, -50%);
    transition: filter 0.2s ease;
  }

  .tap-dot:hover .tap-dot-glow { opacity: 0.7; }
  .tap-dot:hover .tap-dot-core { filter: brightness(1.2); }

  .tap-dot-glow {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    opacity: 0.4;
    transition: opacity 0.2s ease;
    pointer-events: none;
  }

  .tap-dot-core {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 14px;
    height: 14px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: filter 0.2s ease, width 0.15s, height 0.15s;
  }

  .tap-dot-core span {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    font-weight: 600;
    color: oklch(10% 0.01 260);
    line-height: 1;
    pointer-events: none;
  }

  .tap-dot.selected .tap-dot-core {
    width: 18px;
    height: 18px;
    box-shadow: 0 0 10px currentColor, 0 0 20px currentColor;
  }

  .tap-dot.selected .tap-dot-glow {
    width: 40px;
    height: 40px;
    opacity: 0.55;
  }

  .tap-tooltip {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: oklch(14% 0.015 260 / 0.95);
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    padding: 3px 7px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    color: var(--text-secondary);
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .tap-dot:hover .tap-tooltip { opacity: 1; }

  .star {
    position: absolute;
    border-radius: 50%;
    background: oklch(90% 0.02 240);
    pointer-events: none;
  }

  @keyframes twinkle     { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.5;  } }
  @keyframes twinkle-slow { 0%, 100% { opacity: 0.08; } 50% { opacity: 0.35; } }
  @keyframes twinkle-fast { 0%, 100% { opacity: 0.2;  } 50% { opacity: 0.6;  } }

  .ring-label {
    position: absolute;
    font-family: 'JetBrains Mono', monospace;
    font-size: 7px;
    font-weight: 400;
    color: var(--text-dim);
    opacity: 0.45;
    pointer-events: none;
    user-select: none;
  }

  /* ================================================================
     RIGHT PANEL
     ================================================================ */
  .right-panel {
    grid-column: 2;
    grid-row: 2;
    background: var(--bg-panel);
    padding: 6px 14px 4px;
    display: flex;
    flex-direction: column;
    gap: 0;
    overflow: hidden;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }

  .section-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8.5px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .section-line {
    flex: 1;
    height: 1px;
    background: var(--border-dim);
  }

  .section-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 7.5px;
    font-weight: 500;
    color: var(--accent-stellar-dim);
    border: 1px solid oklch(85% 0.06 240 / 0.2);
    border-radius: 3px;
    padding: 1px 5px;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.15s ease;
    flex-shrink: 0;
  }

  .section-tag:hover {
    border-color: oklch(85% 0.08 240 / 0.4);
    color: var(--accent-stellar);
  }

  .section-tag.active {
    border-color: oklch(85% 0.08 240 / 0.5);
    color: var(--accent-stellar);
    background: oklch(85% 0.06 240 / 0.08);
  }

  .knob-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 2px;
  }

  .knob {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 88px;
  }

  .knob-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 2px;
    text-align: center;
  }

  .knob-visual {
    width: 42px;
    height: 42px;
    position: relative;
    margin-bottom: 1px;
  }

  .knob-visual svg { width: 100%; height: 100%; }

  .knob-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    font-weight: 400;
    color: var(--text-secondary);
    text-align: center;
    line-height: 1;
  }

  .toggle-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--bg-recessed);
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    padding: 1px 7px;
    height: 18px;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .toggle-pill.active {
    border-color: var(--accent-stellar-dim);
    color: var(--accent-stellar);
    background: oklch(85% 0.06 240 / 0.08);
  }

  .toggle-pill .toggle-indicator {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }

  .toggle-pill.active .toggle-indicator {
    background: var(--accent-stellar);
    box-shadow: 0 0 4px var(--accent-stellar);
  }

  .toggle-pill:not(.active) { color: var(--text-dim); }

  .sync-row {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 1px;
    margin-top: -1px;
  }

  .small-dropdown {
    background: var(--bg-recessed);
    border: 1px solid var(--border-subtle);
    border-radius: 3px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    padding: 1px 5px;
    height: 18px;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    letter-spacing: 0.05em;
  }

  .osc-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .osc-port {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .osc-port-value {
    background: var(--bg-recessed);
    border: 1px solid var(--border-dim);
    border-radius: 3px;
    padding: 1px 5px;
    color: var(--text-secondary);
    font-size: 9px;
    font-family: 'JetBrains Mono', monospace;
    min-width: 38px;
    text-align: center;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ================================================================
     BOTTOM PANEL
     ================================================================ */
  .bottom-panel {
    grid-column: 1 / -1;
    grid-row: 3;
    background: var(--bg-panel);
    border-top: 1px solid var(--border-dim);
    padding: 8px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .object-selector {
    display: flex;
    gap: 3px;
    margin-bottom: 6px;
  }

  .obj-btn {
    flex: 1;
    height: 24px;
    background: var(--bg-recessed);
    border: 1px solid var(--border-dim);
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .obj-btn:hover { border-color: oklch(28% 0.02 260); color: var(--text-secondary); }

  .obj-btn.active {
    font-weight: 600;
    background: oklch(85% 0.06 240 / 0.06);
  }

  .obj-btn.enabled {
    color: var(--text-secondary);
    border-color: oklch(25% 0.015 260);
  }

  .object-controls {
    display: flex;
    align-items: flex-start;
    gap: 0;
    flex: 1;
    justify-content: flex-start;
    padding-left: 8px;
  }

  .obj-control {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .obj-control-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 7.5px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 2px;
    text-align: center;
  }

  .obj-on-off {
    width: 36px;
    height: 22px;
    border-radius: 11px;
    background: var(--bg-recessed);
    border: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 7.5px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    transition: all 0.15s ease;
    margin-top: 16px;
  }

  .obj-on-off.active {
    background: oklch(85% 0.06 240 / 0.1);
    border-color: var(--accent-stellar-dim);
    color: var(--accent-stellar);
  }

  .obj-knob-visual {
    width: 36px;
    height: 36px;
    position: relative;
    margin-bottom: 2px;
  }

  .obj-knob-visual svg { width: 100%; height: 100%; }

  .obj-knob-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8.5px;
    font-weight: 400;
    color: var(--text-secondary);
    text-align: center;
    line-height: 1;
  }

  .traj-dropdown {
    background: var(--bg-recessed);
    border: 1px solid var(--border-subtle);
    border-radius: 3px;
    color: var(--text-secondary);
    font-family: 'DM Sans', sans-serif;
    font-size: 9px;
    padding: 2px 6px;
    height: 20px;
    width: 68px;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    margin-top: 6px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="plugin">

  <!-- HEADER -->
  <div class="header">
    <div class="sml-badge">SML</div>
    <div class="plugin-title">OpenSpatialDelay</div>
    <div class="version-tag">v0.7</div>
    <div class="header-spacer"></div>

    <div class="header-control">
      <span class="header-control-label">Preset</span>
      <div class="preset-nav">
        <select class="header-dropdown" style="min-width: 118px;">
          <option>Observatory Init</option>
        </select>
        <button class="preset-nav-btn">&lsaquo;</button>
        <button class="preset-nav-btn">&rsaquo;</button>
        <button class="preset-save-btn">Save</button>
      </div>
    </div>

    <div class="header-control">
      <span class="header-control-label">Output</span>
      <select class="header-dropdown" style="min-width: 105px;">
        <option>Binaural</option>
      </select>
    </div>

    <div class="header-control">
      <span class="header-control-label">HRTF Profile</span>
      <select class="header-dropdown" style="min-width: 110px;">
        <option>Studio Reference</option>
      </select>
    </div>
  </div>

  <!-- SPATIAL MAP -->
  <div class="spatial-map-container">
    <div class="spatial-map" id="spatialMap">
      <canvas id="mapCanvas"></canvas>
      <div class="map-noise"></div>
      <div class="tap-dots" id="tapDots"></div>
      <svg class="map-overlay" id="mapOverlay" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="cardinal" id="cardF">F</div>
      <div class="cardinal" id="cardB">B</div>
      <div class="cardinal" id="cardL">L</div>
      <div class="cardinal" id="cardR">R</div>
      <div class="ring-label" id="ringLabel025"></div>
      <div class="ring-label" id="ringLabel050"></div>
      <div class="ring-label" id="ringLabel075"></div>
      <div class="ring-label" id="ringLabel100"></div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel" id="rightPanel">
    <div class="section-header">
      <span class="section-title">Delay</span>
      <span class="section-line"></span>
    </div>
    <div class="knob-row" id="delayRow1"></div>
    <div class="sync-row">
      <div class="toggle-pill active" id="syncToggle">
        <span class="toggle-indicator"></span>
        <span>Sync</span>
      </div>
      <select class="small-dropdown"><option>Straight</option></select>
    </div>
    <div class="knob-row" id="delayRow2"></div>

    <div class="section-header">
      <span class="section-title">Tone</span>
      <span class="section-line"></span>
      <span class="section-tag" id="airToggle">AIR</span>
    </div>
    <div class="knob-row" id="toneRow"></div>

    <div class="section-header">
      <span class="section-title">Mix</span>
      <span class="section-line"></span>
    </div>
    <div class="knob-row" id="mixRow"></div>

    <div style="flex:1; min-height: 2px;"></div>

    <div class="section-header" style="margin-bottom: 3px;">
      <span class="section-title">OSC</span>
      <span class="section-line"></span>
    </div>
    <div class="osc-row">
      <div class="toggle-pill" id="oscToggle">
        <span class="toggle-indicator"></span>
        <span>OSC</span>
      </div>
      <div class="osc-port">
        <span>Port</span>
        <div class="osc-port-value">4002</div>
      </div>
    </div>
  </div>

  <!-- BOTTOM PANEL -->
  <div class="bottom-panel">
    <div class="object-selector" id="objectSelector"></div>
    <div class="object-controls" id="objectControls"></div>
  </div>

</div>

<script>
// ================================================================
// Configuration
// ================================================================
const TAP_COLORS = [
  'hsl(0, 80%, 65%)',   'hsl(30, 80%, 65%)',  'hsl(75, 65%, 52%)',
  'hsl(140, 60%, 52%)', 'hsl(160, 70%, 55%)', 'hsl(180, 70%, 60%)',
  'hsl(200, 75%, 60%)', 'hsl(220, 75%, 65%)', 'hsl(240, 70%, 65%)',
  'hsl(270, 70%, 65%)', 'hsl(300, 70%, 65%)', 'hsl(330, 75%, 65%)'
];

const TAPS = [
  { id: 1, az: 315, dist: 0.5, enabled: true },
  { id: 2, az: 45,  dist: 0.5, enabled: true },
  { id: 3, az: 225, dist: 0.5, enabled: true },
  { id: 4, az: 135, dist: 0.5, enabled: true },
  { id: 5, az: 0,   dist: 0.3, enabled: false },
  { id: 6, az: 60,  dist: 0.7, enabled: false },
  { id: 7, az: 120, dist: 0.4, enabled: false },
  { id: 8, az: 180, dist: 0.6, enabled: false },
  { id: 9, az: 240, dist: 0.5, enabled: false },
  { id: 10, az: 300, dist: 0.8, enabled: false },
  { id: 11, az: 30,  dist: 0.3, enabled: false },
  { id: 12, az: 150, dist: 0.6, enabled: false }
];

let selectedTap = 0;
let knobIdCounter = 0;

// ================================================================
// SVG Knob Arc Generator
// ================================================================
function createKnobSVG(opts) {
  const { size = 42, value = 0.5, color = 'oklch(85% 0.12 240)', isBipolar = false } = opts;
  const id = 'kg' + (knobIdCounter++);
  const r = size / 2;
  const strokeW = 2.2;
  const arcR = r - 5;
  const startAngle = 135;
  const totalSweep = 270;

  function polar(cx, cy, radius, deg) {
    const rad = (deg - 90) * Math.PI / 180;
    return { x: cx + radius * Math.cos(rad), y: cy + radius * Math.sin(rad) };
  }

  function arc(cx, cy, radius, a1, a2) {
    const s = polar(cx, cy, radius, a2);
    const e = polar(cx, cy, radius, a1);
    const large = (a2 - a1) > 180 ? 1 : 0;
    return `M ${s.x} ${s.y} A ${radius} ${radius} 0 ${large} 0 ${e.x} ${e.y}`;
  }

  const trackPath = arc(r, r, arcR, startAngle, startAngle + totalSweep);

  let vs, ve;
  if (isBipolar) {
    const mid = startAngle + totalSweep / 2;
    if (value >= 0.5) { vs = mid; ve = mid + (value - 0.5) * 2 * totalSweep / 2; }
    else { vs = mid - (0.5 - value) * 2 * totalSweep / 2; ve = mid; }
  } else {
    vs = startAngle;
    ve = startAngle + value * totalSweep;
  }
  const valPath = arc(r, r, arcR, vs, ve);

  const pAngle = startAngle + value * totalSweep;
  const pIn = polar(r, r, arcR - 4, pAngle);
  const pOut = polar(r, r, arcR + 1, pAngle);

  const ticks = [0, 0.5, 1].map(t => {
    const a = startAngle + t * totalSweep;
    const i = polar(r, r, arcR + 2, a);
    const o = polar(r, r, arcR + 5, a);
    return `<line x1="${i.x}" y1="${i.y}" x2="${o.x}" y2="${o.y}" stroke="oklch(20% 0.015 260)" stroke-width="0.7" stroke-linecap="round"/>`;
  }).join('');

  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
    <defs><filter id="${id}" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter></defs>
    <circle cx="${r}" cy="${r}" r="${arcR + 1.5}" fill="oklch(6% 0.012 260)" stroke="oklch(10% 0.012 260)" stroke-width="0.8"/>
    <path d="${trackPath}" fill="none" stroke="oklch(18% 0.012 260)" stroke-width="${strokeW}" stroke-linecap="round"/>
    <path d="${valPath}" fill="none" stroke="${color}" stroke-width="${strokeW}" stroke-linecap="round" filter="url(#${id})"/>
    ${ticks}
    <circle cx="${r}" cy="${r}" r="1.8" fill="oklch(28% 0.015 260)"/>
    <line x1="${pIn.x}" y1="${pIn.y}" x2="${pOut.x}" y2="${pOut.y}" stroke="${color}" stroke-width="1.3" stroke-linecap="round" opacity="0.85"/>
  </svg>`;
}

function createSmallKnobSVG(opts) {
  return createKnobSVG({ ...opts, size: 36 });
}

// ================================================================
// Right Panel Knobs
// ================================================================
function renderKnob(container, label, value, displayValue, opts = {}) {
  const knob = document.createElement('div');
  knob.className = 'knob';
  const color = opts.color || 'oklch(85% 0.12 240)';
  knob.innerHTML = `
    <div class="knob-label">${label}</div>
    <div class="knob-visual">${createKnobSVG({ value, color, isBipolar: opts.bipolar || false })}</div>
    <div class="knob-value">${displayValue}</div>`;
  container.appendChild(knob);
}

const delayRow1 = document.getElementById('delayRow1');
renderKnob(delayRow1, 'Input', 0.5, '0.0 dB');
renderKnob(delayRow1, 'Time', 0.35, '1/4');

const delayRow2 = document.getElementById('delayRow2');
renderKnob(delayRow2, 'Feedback', 0.45, '45%');
renderKnob(delayRow2, 'Pitch', 0.5, '0 st', { bipolar: true, color: 'oklch(55% 0.18 290)' });

const toneRow = document.getElementById('toneRow');
renderKnob(toneRow, 'HP', 0.05, '20 Hz');
renderKnob(toneRow, 'LP', 0.95, '18 kHz');

const mixRow = document.getElementById('mixRow');
renderKnob(mixRow, 'Dry/Wet', 0.4, '40%', { color: 'oklch(78% 0.14 70)' });
renderKnob(mixRow, 'Output', 0.5, '0.0 dB', { color: 'oklch(78% 0.14 70)' });

// ================================================================
// Bottom Panel
// ================================================================
function renderObjectSelector() {
  const container = document.getElementById('objectSelector');
  for (let i = 0; i < 12; i++) {
    const btn = document.createElement('button');
    btn.className = 'obj-btn';
    btn.textContent = i + 1;
    btn.dataset.index = i;
    if (TAPS[i].enabled) btn.classList.add('enabled');
    if (i === selectedTap) {
      btn.classList.add('active');
      btn.style.borderColor = TAP_COLORS[i];
      btn.style.color = TAP_COLORS[i];
    }
    btn.addEventListener('click', () => selectTap(i));
    container.appendChild(btn);
  }
}

function selectTap(index) {
  selectedTap = index;
  document.querySelectorAll('.obj-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === index);
    if (i === index) {
      btn.style.borderColor = TAP_COLORS[i];
      btn.style.color = TAP_COLORS[i];
    } else {
      btn.style.borderColor = '';
      btn.style.color = '';
    }
  });
  document.querySelectorAll('.tap-dot').forEach((dot, i) => {
    dot.classList.toggle('selected', parseInt(dot.dataset.index) === index);
  });
  renderObjectControls();
}

function renderObjectControls() {
  const container = document.getElementById('objectControls');
  container.innerHTML = '';
  const tap = TAPS[selectedTap];
  const color = TAP_COLORS[selectedTap];

  // ON/OFF
  const onOff = document.createElement('div');
  onOff.className = 'obj-control';
  onOff.style.width = '52px';
  onOff.innerHTML = `<div class="obj-on-off ${tap.enabled ? 'active' : ''}" id="onOffBtn">${tap.enabled ? 'ON' : 'OFF'}</div>`;
  container.appendChild(onOff);

  function addKnob(labelText, value, displayVal, width, opts = {}) {
    const ctrl = document.createElement('div');
    ctrl.className = 'obj-control';
    ctrl.style.width = width + 'px';
    const kc = opts.color || color;
    ctrl.innerHTML = `
      <div class="obj-control-label">${labelText}</div>
      <div class="obj-knob-visual">${createSmallKnobSVG({ value, color: kc, isBipolar: opts.bipolar || false })}</div>
      <div class="obj-knob-value">${displayVal}</div>`;
    container.appendChild(ctrl);
  }

  let azDisplay = tap.az;
  if (azDisplay > 180) azDisplay = azDisplay - 360;

  addKnob('Azimuth', (tap.az % 360) / 360, azDisplay + '\u00B0', 96);
  addKnob('Elev', 0.5, '0\u00B0', 76, { bipolar: true });
  addKnob('Dist', tap.dist, tap.dist.toFixed(2), 96);
  addKnob('Doppler', 0, '0%', 96);

  // Trajectory dropdown
  const trajCtrl = document.createElement('div');
  trajCtrl.className = 'obj-control';
  trajCtrl.style.width = '96px';
  trajCtrl.innerHTML = `
    <div class="obj-control-label">Traj</div>
    <select class="traj-dropdown">
      <option>None</option><option>Spiral</option><option>Orbit</option>
      <option>Bounce</option><option>Figure-8</option><option>Random</option>
    </select>`;
  container.appendChild(trajCtrl);

  addKnob('Speed', 0.25, '0.5x', 96);
}

renderObjectSelector();
renderObjectControls();

// ================================================================
// Spatial Map Canvas
// ================================================================
function renderMapCanvas() {
  const canvas = document.getElementById('mapCanvas');
  const container = canvas.parentElement;
  const rect = container.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const w = rect.width, h = rect.height;
  const cx = w / 2, cy = h / 2;

  // Deep void gradient
  const vg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.7);
  vg.addColorStop(0, '#0d0d1a');
  vg.addColorStop(0.3, '#0b0b16');
  vg.addColorStop(0.6, '#090912');
  vg.addColorStop(1, '#07070e');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, w, h);

  // Nebula washes
  const n1 = ctx.createRadialGradient(cx * 0.65, cy * 0.55, 0, cx * 0.65, cy * 0.55, w * 0.45);
  n1.addColorStop(0, 'rgba(55, 25, 85, 0.055)');
  n1.addColorStop(0.5, 'rgba(30, 18, 65, 0.025)');
  n1.addColorStop(1, 'transparent');
  ctx.fillStyle = n1;
  ctx.fillRect(0, 0, w, h);

  const n2 = ctx.createRadialGradient(cx * 1.4, cy * 1.35, 0, cx * 1.4, cy * 1.35, w * 0.35);
  n2.addColorStop(0, 'rgba(25, 45, 75, 0.04)');
  n2.addColorStop(0.5, 'rgba(18, 32, 55, 0.02)');
  n2.addColorStop(1, 'transparent');
  ctx.fillStyle = n2;
  ctx.fillRect(0, 0, w, h);

  // Subtle warm nebula hint
  const n3 = ctx.createRadialGradient(cx * 1.1, cy * 0.4, 0, cx * 1.1, cy * 0.4, w * 0.25);
  n3.addColorStop(0, 'rgba(80, 50, 30, 0.02)');
  n3.addColorStop(1, 'transparent');
  ctx.fillStyle = n3;
  ctx.fillRect(0, 0, w, h);

  // Vignette
  const vig = ctx.createRadialGradient(cx, cy, w * 0.15, cx, cy, Math.max(w, h) * 0.65);
  vig.addColorStop(0, 'transparent');
  vig.addColorStop(1, 'rgba(0, 0, 0, 0.35)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, w, h);
}

// ================================================================
// Spatial Map SVG Overlay
// ================================================================
function renderMapOverlay() {
  const svg = document.getElementById('mapOverlay');
  const container = svg.parentElement;
  const rect = container.getBoundingClientRect();
  const w = rect.width, h = rect.height;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  const cx = w / 2, cy = h / 2;
  const maxR = Math.min(w, h) * 0.45;

  const ringC = 'rgba(100, 130, 160, 0.12)';
  const crossC = 'rgba(80, 110, 140, 0.07)';
  const retC = 'rgba(160, 190, 220, 0.22)';

  let s = `
    <defs>
      <filter id="rglow" x="-10%" y="-10%" width="120%" height="120%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <line x1="0" y1="${cy}" x2="${w}" y2="${cy}" stroke="${crossC}" stroke-width="0.4" stroke-dasharray="2 6"/>
    <line x1="${cx}" y1="0" x2="${cx}" y2="${h}" stroke="${crossC}" stroke-width="0.4" stroke-dasharray="2 6"/>
    <line x1="${cx - maxR * 0.707}" y1="${cy - maxR * 0.707}" x2="${cx + maxR * 0.707}" y2="${cy + maxR * 0.707}" stroke="${crossC}" stroke-width="0.25" stroke-dasharray="1 8" opacity="0.5"/>
    <line x1="${cx + maxR * 0.707}" y1="${cy - maxR * 0.707}" x2="${cx - maxR * 0.707}" y2="${cy + maxR * 0.707}" stroke="${crossC}" stroke-width="0.25" stroke-dasharray="1 8" opacity="0.5"/>`;

  [0.25, 0.50, 0.75, 1.00].forEach(r => {
    s += `<circle cx="${cx}" cy="${cy}" r="${r * maxR}" fill="none" stroke="${ringC}" stroke-width="0.5" filter="url(#rglow)"/>`;
  });

  // Reticle
  const rr = 7;
  s += `
    <circle cx="${cx}" cy="${cy}" r="${rr}" fill="none" stroke="${retC}" stroke-width="0.5"/>
    <circle cx="${cx}" cy="${cy}" r="1.3" fill="${retC}"/>
    <line x1="${cx}" y1="${cy - rr - 2}" x2="${cx}" y2="${cy - rr - 10}" stroke="${retC}" stroke-width="0.4"/>
    <line x1="${cx}" y1="${cy + rr + 2}" x2="${cx}" y2="${cy + rr + 10}" stroke="${retC}" stroke-width="0.4"/>
    <line x1="${cx - rr - 2}" y1="${cy}" x2="${cx - rr - 10}" y2="${cy}" stroke="${retC}" stroke-width="0.4"/>
    <line x1="${cx + rr + 2}" y1="${cy}" x2="${cx + rr + 10}" y2="${cy}" stroke="${retC}" stroke-width="0.4"/>
    <line x1="${cx - rr}" y1="${cy - 1.2}" x2="${cx - rr}" y2="${cy + 1.2}" stroke="${retC}" stroke-width="0.4"/>
    <line x1="${cx + rr}" y1="${cy - 1.2}" x2="${cx + rr}" y2="${cy + 1.2}" stroke="${retC}" stroke-width="0.4"/>
    <line x1="${cx - 1.2}" y1="${cy - rr}" x2="${cx + 1.2}" y2="${cy - rr}" stroke="${retC}" stroke-width="0.4"/>
    <line x1="${cx - 1.2}" y1="${cy + rr}" x2="${cx + 1.2}" y2="${cy + rr}" stroke="${retC}" stroke-width="0.4"/>`;

  svg.innerHTML = s;

  // Cardinals
  document.getElementById('cardF').style.cssText = `top: ${cy - maxR - 20}px; left: ${cx}px; transform: translateX(-50%);`;
  document.getElementById('cardB').style.cssText = `top: ${cy + maxR + 6}px; left: ${cx}px; transform: translateX(-50%);`;
  document.getElementById('cardL').style.cssText = `top: ${cy}px; left: ${cx - maxR - 16}px; transform: translateY(-50%);`;
  document.getElementById('cardR').style.cssText = `top: ${cy}px; left: ${cx + maxR + 6}px; transform: translateY(-50%);`;

  // Ring labels along ~30deg below horizontal on right side (clear of R/B cardinals)
  [0.25, 0.50, 0.75, 1.00].forEach(r => {
    const label = document.getElementById('ringLabel' + String(Math.round(r * 100)).padStart(3, '0'));
    label.textContent = r.toFixed(2);
    // 30 degrees below horizontal-right
    const ang = 30 * Math.PI / 180;
    const lx = cx + Math.cos(ang) * r * maxR + 3;
    const ly = cy + Math.sin(ang) * r * maxR + 2;
    label.style.cssText = `top: ${ly}px; left: ${lx}px; opacity: 0.5;`;
  });
}

// ================================================================
// Stars
// ================================================================
function createStars() {
  const container = document.getElementById('spatialMap');
  container.querySelectorAll('.star').forEach(s => s.remove());
  const rect = container.getBoundingClientRect();
  for (let i = 0; i < 35; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const sz = Math.random() < 0.12 ? 2 : 1;
    const dur = 3 + Math.random() * 6;
    const del = Math.random() * 5;
    const anim = ['twinkle', 'twinkle-slow', 'twinkle-fast'][Math.floor(Math.random() * 3)];
    star.style.cssText = `left:${Math.random() * rect.width}px; top:${Math.random() * rect.height}px;
      width:${sz}px; height:${sz}px; opacity:${0.1 + Math.random() * 0.2};
      animation:${anim} ${dur}s ${del}s ease-in-out infinite;`;
    if (Math.random() < 0.18) star.style.background = 'oklch(85% 0.05 70)';
    else if (Math.random() < 0.14) star.style.background = 'oklch(80% 0.06 290)';
    container.appendChild(star);
  }
}

// ================================================================
// Tap Dots
// ================================================================
function spatialToPixel(azDeg, dist) {
  const container = document.getElementById('spatialMap');
  const rect = container.getBoundingClientRect();
  const cx = rect.width / 2, cy = rect.height / 2;
  const maxR = Math.min(rect.width, rect.height) * 0.45;
  const rad = azDeg * Math.PI / 180;
  return { x: cx - Math.sin(rad) * dist * maxR, y: cy - Math.cos(rad) * dist * maxR };
}

function renderTapDots() {
  const container = document.getElementById('tapDots');
  container.innerHTML = '';
  TAPS.forEach((tap, i) => {
    if (!tap.enabled) return;
    const pos = spatialToPixel(tap.az, tap.dist);
    const color = TAP_COLORS[i];
    const dot = document.createElement('div');
    dot.className = `tap-dot ${i === selectedTap ? 'selected' : ''}`;
    dot.style.left = pos.x + 'px';
    dot.style.top = pos.y + 'px';
    dot.style.color = color;
    dot.dataset.index = i;
    let azD = tap.az; if (azD > 180) azD -= 360;
    dot.innerHTML = `
      <div class="tap-dot-glow" style="background:radial-gradient(circle,${color}66 0%,${color}22 40%,transparent 70%)"></div>
      <div class="tap-dot-core" style="background:${color}; box-shadow:0 0 8px ${color}88,0 0 16px ${color}44;">
        <span>${tap.id}</span>
      </div>
      <div class="tap-tooltip">Az ${azD}\u00B0 \u00B7 D ${tap.dist.toFixed(2)}</div>`;
    dot.addEventListener('click', () => selectTap(i));
    container.appendChild(dot);
  });
}

// ================================================================
// Toggle Interactions
// ================================================================
document.getElementById('syncToggle').addEventListener('click', function() { this.classList.toggle('active'); });
document.getElementById('oscToggle').addEventListener('click', function() { this.classList.toggle('active'); });
document.getElementById('airToggle').addEventListener('click', function() {
  this.classList.toggle('active');
});

document.addEventListener('click', function(e) {
  const btn = e.target.closest('#onOffBtn');
  if (!btn) return;
  const tap = TAPS[selectedTap];
  tap.enabled = !tap.enabled;
  btn.classList.toggle('active', tap.enabled);
  btn.textContent = tap.enabled ? 'ON' : 'OFF';
  const sBtn = document.querySelectorAll('.obj-btn')[selectedTap];
  sBtn.classList.toggle('enabled', tap.enabled);
  renderTapDots();
});

// ================================================================
// Init
// ================================================================
function init() {
  renderMapCanvas();
  renderMapOverlay();
  createStars();
  renderTapDots();
}

window.addEventListener('resize', init);
init();
</script>
</body>
</html>
