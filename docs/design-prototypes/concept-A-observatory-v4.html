<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenSpatialDelay — Concept A v4: Observatory (Draft 4)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300;1,9..40,400&family=JetBrains+Mono:wght@300;400;500;600&display=swap');

  /* ================================================================
     OKLCH Color Palette — Observatory v4
     ================================================================ */
  :root {
    --bg-void:        oklch(7% 0.015 260);
    --bg-panel:       oklch(11% 0.012 260);
    --bg-header:      oklch(9% 0.014 260);
    --bg-recessed:    oklch(5% 0.012 260);
    --bg-well:        oklch(6% 0.013 260);
    --border-subtle:  oklch(20% 0.015 260);
    --border-dim:     oklch(16% 0.012 260);
    --ring-glow:      oklch(22% 0.02 260);
    --accent-stellar: oklch(85% 0.12 240);
    --accent-stellar-dim: oklch(60% 0.08 240);
    --accent-violet:  oklch(55% 0.18 290);
    --accent-violet-dim: oklch(40% 0.12 290);
    --accent-amber:   oklch(78% 0.14 70);
    --accent-amber-dim: oklch(55% 0.09 70);
    --text-primary:   oklch(92% 0.008 260);
    --text-secondary: oklch(68% 0.015 260);
    --text-dim:       oklch(48% 0.012 260);
    --text-etched:    oklch(42% 0.01 260);
    --plugin-w: 820px;
    --plugin-h: 580px;
    --header-h: 52px;
    --right-panel-w: 264px;
    --bottom-panel-h: 150px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: oklch(5% 0.01 260);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'DM Sans', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ================================================================
     Plugin Frame — Concept B Grid: right panel spans full height
     ================================================================ */
  .plugin {
    width: var(--plugin-w);
    height: var(--plugin-h);
    background: var(--bg-void);
    border-radius: 6px;
    overflow: hidden;
    display: grid;
    grid-template-rows: var(--header-h) 1fr var(--bottom-panel-h);
    grid-template-columns: 1fr var(--right-panel-w);
    box-shadow:
      0 0 0 1px oklch(18% 0.02 260),
      0 24px 80px rgba(0,0,0,0.6),
      0 4px 16px rgba(0,0,0,0.4);
  }

  /* ================================================================
     HEADER
     ================================================================ */
  .header {
    grid-column: 1 / -1;
    grid-row: 1;
    background: var(--bg-header);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    padding: 0 10px;
    gap: 6px;
    position: relative;
    z-index: 10;
  }

  .header::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, oklch(85% 0.08 240 / 0.3) 20%, oklch(85% 0.12 240 / 0.5) 50%, oklch(85% 0.08 240 / 0.3) 80%, transparent 100%);
  }

  .sml-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 0.15em;
    color: var(--accent-stellar);
    border: 1px solid oklch(85% 0.08 240 / 0.35);
    border-radius: 3px;
    padding: 2px 5px 1px;
    line-height: 1;
    text-transform: uppercase;
    flex-shrink: 0;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .sml-badge:hover {
    border-color: oklch(85% 0.12 240 / 0.6);
    color: oklch(92% 0.14 240);
    background: oklch(85% 0.06 240 / 0.06);
  }

  .plugin-title {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .version-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--text-dim);
    margin-left: -2px;
  }

  .header-spacer { flex: 1; min-width: 0; }

  .header-control {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    flex-shrink: 0;
  }

  .header-control-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 7.5px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding-left: 2px;
  }

  .header-dropdown {
    background: var(--bg-recessed);
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    color: var(--text-secondary);
    font-family: 'DM Sans', sans-serif;
    font-size: 10.5px;
    padding: 3px 20px 3px 7px;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    height: 22px;
    background-image: url("data:image/svg+xml,%3Csvg width='8' height='5' viewBox='0 0 8 5' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L4 4L7 1' stroke='%23667788' stroke-width='1' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 6px center;
    transition: border-color 0.15s ease;
  }

  .header-dropdown:hover { border-color: oklch(30% 0.02 260); }
  .header-dropdown:focus { outline: none; border-color: var(--accent-stellar-dim); }

  .preset-nav {
    display: flex;
    align-items: flex-end;
    gap: 2px;
  }

  .preset-nav-btn {
    background: var(--bg-recessed);
    border: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    font-size: 11px;
    width: 20px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 3px;
    transition: background 0.15s, border-color 0.15s;
    font-family: 'DM Sans', sans-serif;
  }

  .preset-nav-btn:hover { background: oklch(14% 0.015 260); }

  .preset-save-btn {
    background: var(--bg-recessed);
    border: 1px solid var(--border-subtle);
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.08em;
    padding: 0 6px;
    height: 22px;
    border-radius: 3px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.15s ease;
  }

  .preset-save-btn:hover { border-color: var(--accent-stellar-dim); color: var(--text-secondary); }

  /* Header toggle pills (AIR, OSC) */
  .header-toggle {
    display: inline-flex;
    align-items: center;
    gap: 0;
    background: var(--bg-recessed);
    border: 1px solid var(--border-dim);
    border-radius: 3px;
    padding: 0 6px;
    height: 22px;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    flex-shrink: 0;
  }

  .header-toggle:hover { border-color: oklch(28% 0.02 260); }

  .header-toggle.active-stellar {
    border-color: var(--accent-stellar-dim);
    color: var(--accent-stellar);
    background: oklch(85% 0.06 240 / 0.10);
  }

  .header-toggle.active-green {
    border-color: oklch(60% 0.12 155);
    color: oklch(72% 0.14 155);
    background: oklch(60% 0.08 155 / 0.10);
  }

  .header-toggles {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
    align-items: center;
  }

  .header-sep {
    width: 1px;
    height: 24px;
    background: var(--border-dim);
    flex-shrink: 0;
    margin: 0 2px;
  }

  /* ================================================================
     SPATIAL MAP
     ================================================================ */
  .spatial-map-container {
    grid-column: 1;
    grid-row: 2;
    position: relative;
    overflow: hidden;
    border-right: 1px solid var(--border-dim);
    border-bottom: 1px solid var(--border-dim);
  }

  .spatial-map {
    width: 100%;
    height: 100%;
    position: relative;
  }

  .spatial-map canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
  }

  .map-noise {
    position: absolute;
    inset: 0;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 256px 256px;
    pointer-events: none;
    mix-blend-mode: screen;
  }

  .map-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .cardinal {
    position: absolute;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.2em;
    color: var(--text-etched);
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
  }

  .tap-dots {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .tap-dot {
    position: absolute;
    pointer-events: all;
    cursor: pointer;
    transform: translate(-50%, -50%);
    transition: filter 0.2s ease;
  }

  .tap-dot:hover .tap-dot-glow { opacity: 0.7; }
  .tap-dot:hover .tap-dot-core { filter: brightness(1.2); }

  .tap-dot-glow {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    opacity: 0.4;
    transition: opacity 0.2s ease;
    pointer-events: none;
  }

  .tap-dot-ring {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    pointer-events: none;
  }

  .tap-dot-core {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: filter 0.2s ease;
  }

  .tap-dot-core span {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    font-weight: 600;
    color: oklch(10% 0.01 260);
    line-height: 1;
    pointer-events: none;
  }

  .tap-dot.selected .tap-dot-core {
    box-shadow: 0 0 10px currentColor, 0 0 20px currentColor;
  }

  .tap-dot.selected .tap-dot-glow {
    opacity: 0.55;
  }

  /* Tap pulse animation — sequential firing */
  .tap-dot .tap-pulse-ring {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 1.5px solid currentColor;
    opacity: 0;
    pointer-events: none;
    animation: tapPulse 3s ease-out infinite;
  }

  @keyframes tapPulse {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(1); }
    3%   { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
    8%   { opacity: 0.6; transform: translate(-50%, -50%) scale(1.3); }
    20%  { opacity: 0; transform: translate(-50%, -50%) scale(1.8); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.8); }
  }

  .tap-dot .tap-core-pulse {
    animation: tapCorePulse 3s ease-out infinite;
  }

  @keyframes tapCorePulse {
    0%   { transform: translate(-50%, -50%) scale(1); filter: brightness(1); }
    3%   { transform: translate(-50%, -50%) scale(1.15); filter: brightness(1.5); }
    8%   { transform: translate(-50%, -50%) scale(1.25); filter: brightness(1.4); }
    18%  { transform: translate(-50%, -50%) scale(1); filter: brightness(1); }
    100% { transform: translate(-50%, -50%) scale(1); filter: brightness(1); }
  }

  /* Tooltip — Az + El */
  .tap-tooltip {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: oklch(14% 0.015 260 / 0.95);
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    padding: 3px 7px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    color: var(--text-secondary);
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .tap-dot:hover .tap-tooltip { opacity: 1; }

  /* ================================================================
     STAR FIELD — CSS animation, seamless tiled loop
     ================================================================ */
  .star-field-clip {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .star-field {
    position: absolute;
    width: 200%;
    height: 200%;
    top: 0;
    left: 0;
    animation: starDrift 120s linear infinite;
  }

  @keyframes starDrift {
    from { transform: translate(0, 0); }
    to { transform: translate(-50%, -50%); }
  }

  .star {
    position: absolute;
    border-radius: 50%;
    background: oklch(90% 0.02 240);
    pointer-events: none;
  }

  @keyframes twinkle      { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.5;  } }
  @keyframes twinkle-slow { 0%, 100% { opacity: 0.08; } 50% { opacity: 0.35; } }
  @keyframes twinkle-fast { 0%, 100% { opacity: 0.2;  } 50% { opacity: 0.6;  } }

  .ring-label {
    position: absolute;
    font-family: 'JetBrains Mono', monospace;
    font-size: 7px;
    font-weight: 400;
    color: var(--text-dim);
    opacity: 0.45;
    pointer-events: none;
    user-select: none;
  }

  /* ================================================================
     RIGHT PANEL — SPANS FULL HEIGHT (rows 2-4, Concept B layout)
     ================================================================ */
  .right-panel {
    grid-column: 2;
    grid-row: 2 / 4;
    background: var(--bg-panel);
    padding: 6px 14px 8px;
    display: flex;
    flex-direction: column;
    gap: 0;
    overflow: hidden;
    border-left: 1px solid var(--border-dim);
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
  }

  .section-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8.5px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .section-line {
    flex: 1;
    height: 1px;
    background: var(--border-dim);
  }

  .section-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 7.5px;
    font-weight: 500;
    color: var(--accent-violet-dim);
    border: 1px solid oklch(55% 0.10 290 / 0.25);
    border-radius: 3px;
    padding: 1px 5px;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.15s ease;
    flex-shrink: 0;
    text-transform: uppercase;
  }

  .section-tag:hover {
    border-color: oklch(55% 0.14 290 / 0.45);
    color: var(--accent-violet);
  }

  .section-tag.active {
    border-color: oklch(55% 0.14 290 / 0.55);
    color: var(--accent-violet);
    background: oklch(55% 0.10 290 / 0.08);
  }

  .knob-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 2px;
  }

  .knob {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 72px;
  }

  .knob.wide { width: 88px; }

  .knob-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 2px;
    text-align: center;
  }

  .knob-visual {
    width: 42px;
    height: 42px;
    position: relative;
    margin-bottom: 1px;
  }

  .knob-visual.small {
    width: 36px;
    height: 36px;
  }

  .knob-visual svg { width: 100%; height: 100%; }

  .knob-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    font-weight: 400;
    color: var(--text-secondary);
    text-align: center;
    line-height: 1;
  }

  /* TIME/SYNC — Single toggle button + always-visible dropdowns */
  .time-sync-group {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
    margin-top: -2px;
    margin-bottom: 2px;
    padding-right: 24px;
  }

  .time-sync-toggle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 7.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 2px 10px;
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s ease;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 44px;
  }

  .time-sync-toggle.mode-time {
    background: oklch(85% 0.06 240 / 0.15);
    border-color: var(--accent-stellar-dim);
    color: var(--accent-stellar);
  }

  .time-sync-toggle.mode-sync {
    background: oklch(55% 0.08 290 / 0.15);
    border-color: var(--accent-violet-dim);
    color: var(--accent-violet);
  }

  .sync-dropdown-row {
    display: flex;
    gap: 4px;
    transition: opacity 0.2s ease;
  }

  .sync-dropdown-row.disabled {
    opacity: 0.3;
    pointer-events: none;
  }

  .small-dropdown {
    background: var(--bg-recessed);
    border: 1px solid var(--border-subtle);
    border-radius: 3px;
    color: var(--text-secondary);
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    padding: 1px 5px;
    height: 18px;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    letter-spacing: 0.05em;
  }

  .sync-dropdown-row.disabled .small-dropdown {
    border-color: var(--border-dim);
    color: var(--text-dim);
    cursor: default;
  }

  /* Toggle pills */
  .toggle-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--bg-recessed);
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    padding: 1px 7px;
    height: 18px;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .toggle-pill .toggle-indicator {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }

  .toggle-pill:not(.active) { color: var(--text-dim); }

  .toggle-pill.active {
    border-color: var(--accent-stellar-dim);
    color: var(--accent-stellar);
    background: oklch(85% 0.06 240 / 0.08);
  }

  .toggle-pill.active .toggle-indicator {
    background: var(--accent-stellar);
    box-shadow: 0 0 4px var(--accent-stellar);
  }

  /* OSC section */
  .osc-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 3px;
  }

  .osc-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  .osc-port-value {
    background: var(--bg-recessed);
    border: 1px solid var(--border-dim);
    border-radius: 3px;
    padding: 1px 5px;
    color: var(--text-secondary);
    font-size: 9px;
    font-family: 'JetBrains Mono', monospace;
    min-width: 38px;
    text-align: center;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .osc-ip-value {
    background: var(--bg-recessed);
    border: 1px solid var(--border-dim);
    border-radius: 3px;
    padding: 1px 5px;
    color: var(--text-secondary);
    font-size: 9px;
    font-family: 'JetBrains Mono', monospace;
    min-width: 72px;
    text-align: center;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ================================================================
     FILTER GRAPH — Always visible, dim when FLT off
     ================================================================ */
  .filter-graph-container {
    width: 100%;
    margin-top: 2px;
    margin-bottom: 2px;
    transition: opacity 0.2s ease;
  }

  .filter-graph-svg {
    width: 100%;
    height: 80px;
    display: block;
    background: var(--bg-recessed);
    border: 1px solid var(--border-dim);
    border-radius: 4px;
  }

  .filter-freq-labels {
    display: flex;
    justify-content: space-between;
    padding: 1px 8px 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 7px;
    color: var(--text-dim);
    opacity: 0.6;
  }

  .filter-readout {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    text-align: center;
    margin-top: 2px;
    letter-spacing: 0.04em;
    line-height: 1;
    transition: color 0.2s ease;
  }

  .filter-readout.active { color: var(--text-secondary); }
  .filter-readout.inactive { color: var(--text-dim); }

  /* ================================================================
     BOTTOM PANEL — LEFT SIDE ONLY (grid-column: 1)
     ================================================================ */
  .bottom-panel {
    grid-column: 1;
    grid-row: 3;
    background: var(--bg-panel);
    border-top: 1px solid var(--border-dim);
    border-right: 1px solid var(--border-dim);
    padding: 6px 8px;

<script>
// ================================================================
// Configuration
// ================================================================
const TAP_COLORS = [
  'hsl(0, 80%, 65%)',   'hsl(30, 80%, 65%)',  'hsl(75, 65%, 52%)',
  'hsl(140, 60%, 52%)', 'hsl(160, 70%, 55%)', 'hsl(180, 70%, 60%)',
  'hsl(200, 75%, 60%)', 'hsl(220, 75%, 65%)', 'hsl(240, 70%, 65%)',
  'hsl(270, 70%, 65%)', 'hsl(300, 70%, 65%)', 'hsl(330, 75%, 65%)'
];

const TAPS = [
  { id: 1, az: 315, dist: 0.5, elev: 15,  enabled: true },
  { id: 2, az: 45,  dist: 0.5, elev: -10, enabled: true },
  { id: 3, az: 225, dist: 0.5, elev: 30,  enabled: true },
  { id: 4, az: 135, dist: 0.5, elev: 0,   enabled: true },
  { id: 5, az: 0,   dist: 0.3, elev: 0,   enabled: false },
  { id: 6, az: 60,  dist: 0.7, elev: 0,   enabled: false },
  { id: 7, az: 120, dist: 0.4, elev: 0,   enabled: false },
  { id: 8, az: 180, dist: 0.6, elev: 0,   enabled: false },
  { id: 9, az: 240, dist: 0.5, elev: 0,   enabled: false },
  { id: 10, az: 300, dist: 0.8, elev: 0,  enabled: false },
  { id: 11, az: 30,  dist: 0.3, elev: 0,  enabled: false },
  { id: 12, az: 150, dist: 0.6, elev: 0,  enabled: false }
];

let selectedTap = 0;
let syncMode = false;
let fltActive = false;
let activeTab = 'position';
let knobIdCounter = 0;

// ================================================================
// SVG Knob Arc Generator
// ================================================================
function createKnobSVG(opts) {
  const { size = 42, value = 0.5, color = 'oklch(85% 0.12 240)', isBipolar = false } = opts;
  const id = 'kg' + (knobIdCounter++);
  const r = size / 2;
  const strokeW = 2.2;
  const arcR = r - 5;
  const startAngle = 135;
  const totalSweep = 270;

  function polar(cx, cy, radius, deg) {
    const rad = (deg - 90) * Math.PI / 180;
    return { x: cx + radius * Math.cos(rad), y: cy + radius * Math.sin(rad) };
  }

  function arc(cx, cy, radius, a1, a2) {
    const s = polar(cx, cy, radius, a2);
    const e = polar(cx, cy, radius, a1);
    const large = (a2 - a1) > 180 ? 1 : 0;
    return `M ${s.x} ${s.y} A ${radius} ${radius} 0 ${large} 0 ${e.x} ${e.y}`;
  }

  const trackPath = arc(r, r, arcR, startAngle, startAngle + totalSweep);

  let vs, ve;
  if (isBipolar) {
    const mid = startAngle + totalSweep / 2;
    if (value >= 0.5) { vs = mid; ve = mid + (value - 0.5) * 2 * totalSweep / 2; }
    else { vs = mid - (0.5 - value) * 2 * totalSweep / 2; ve = mid; }
  } else {
    vs = startAngle;
    ve = startAngle + value * totalSweep;
  }
  const valPath = arc(r, r, arcR, vs, ve);

  const pAngle = startAngle + value * totalSweep;
  const pIn = polar(r, r, arcR - 4, pAngle);
  const pOut = polar(r, r, arcR + 1, pAngle);

  const ticks = [0, 0.5, 1].map(t => {
    const a = startAngle + t * totalSweep;
    const i = polar(r, r, arcR + 2, a);
    const o = polar(r, r, arcR + 5, a);
    return `<line x1="${i.x}" y1="${i.y}" x2="${o.x}" y2="${o.y}" stroke="oklch(20% 0.015 260)" stroke-width="0.7" stroke-linecap="round"/>`;
  }).join('');

  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
    <defs><filter id="${id}" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter></defs>
    <circle cx="${r}" cy="${r}" r="${arcR + 1.5}" fill="oklch(5% 0.012 260)" stroke="oklch(10% 0.012 260)" stroke-width="0.8"/>
    <path d="${trackPath}" fill="none" stroke="oklch(18% 0.012 260)" stroke-width="${strokeW}" stroke-linecap="round"/>
    <path d="${valPath}" fill="none" stroke="${color}" stroke-width="${strokeW}" stroke-linecap="round" filter="url(#${id})"/>
    ${ticks}
    <circle cx="${r}" cy="${r}" r="1.8" fill="oklch(28% 0.015 260)"/>
    <line x1="${pIn.x}" y1="${pIn.y}" x2="${pOut.x}" y2="${pOut.y}" stroke="${color}" stroke-width="1.3" stroke-linecap="round" opacity="0.85"/>
  </svg>`;
}

function createSmallKnobSVG(opts) {
  return createKnobSVG({ ...opts, size: 36 });
}

// ================================================================
// Right Panel Knobs — Color consistency per section
// ================================================================
function renderKnob(container, label, value, displayValue, opts = {}) {
  const knob = document.createElement('div');
  knob.className = 'knob' + (opts.wide ? ' wide' : '');
  const color = opts.color || 'oklch(85% 0.12 240)';
  const size = opts.small ? 36 : 42;
  knob.innerHTML = `
    <div class="knob-label">${label}</div>
    <div class="knob-visual${opts.small ? ' small' : ''}">${createKnobSVG({ size, value, color, isBipolar: opts.bipolar || false })}</div>
    <div class="knob-value">${displayValue}</div>`;
  container.appendChild(knob);
}

const stellarColor = 'oklch(85% 0.12 240)';
const violetColor = 'oklch(55% 0.18 290)';
const amberColor = 'oklch(78% 0.14 70)';

// DELAY section — Input, Time, Feedback, Pitch all stellar blue-white
const delayRow1 = document.getElementById('delayRow1');
renderKnob(delayRow1, 'Input', 0.5, '0.0 dB', { color: stellarColor });
renderKnob(delayRow1, 'Time', 0.35, '500 ms', { color: stellarColor });

const delayRow2 = document.getElementById('delayRow2');
renderKnob(delayRow2, 'Feedback', 0.45, '45%', { color: stellarColor });
renderKnob(delayRow2, 'Pitch', 0.5, '0 st', { bipolar: true, color: stellarColor });

// MIX section — all amber
const mixRow = document.getElementById('mixRow');
renderKnob(mixRow, 'Dry/Wet', 0.4, '40%', { color: amberColor });
renderKnob(mixRow, 'Output', 0.5, '0.0 dB', { color: amberColor });

// ================================================================
// Filter Graph SVG — Always visible, opacity varies with FLT state
// ================================================================
function renderFilterGraph() {
  const svg = document.getElementById('filterGraphSvg');
  const rect = svg.getBoundingClientRect();
  const w = rect.width || 236;
  const h = 80;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);

  // Frequency mapping: 20Hz to 20kHz on log scale
  function freqToX(freq) {
    const minF = Math.log10(20);
    const maxF = Math.log10(20000);
    return ((Math.log10(freq) - minF) / (maxF - minF)) * w;
  }

  // Grid lines at 100, 1k, 10k
  const gridColor = 'rgba(100, 130, 160, 0.08)';
  let svgContent = '';
  [100, 1000, 10000].forEach(f => {
    const x = freqToX(f);
    svgContent += `<line x1="${x}" y1="0" x2="${x}" y2="${h}" stroke="${gridColor}" stroke-width="0.3"/>`;
  });

  // Bandpass curve: HP at 20Hz, LP at 18kHz
  const hpFreq = 20;
  const lpFreq = 18000;

  // Build curve path
  const passY = 14;
  const floorY = h - 5;
  const points = [];
  const numPts = 120;

  for (let i = 0; i <= numPts; i++) {
    const t = i / numPts;
    const freq = Math.pow(10, Math.log10(20) + t * (Math.log10(20000) - Math.log10(20)));
    const x = freqToX(freq);
    let y;

    if (freq < hpFreq * 2) {
      const ratio = freq / hpFreq;
      const db = Math.max(-40, 20 * Math.log10(Math.max(0.001, ratio * ratio / (1 + ratio * ratio))));
      y = passY + (-db / 40) * (floorY - passY);
    } else if (freq > lpFreq * 0.5) {
      const ratio = freq / lpFreq;
      const db = Math.max(-40, 20 * Math.log10(Math.max(0.001, 1 / (1 + ratio * ratio))));
      y = passY + (-db / 40) * (floorY - passY);
    } else {
      y = passY;
    }
    y = Math.max(2, Math.min(floorY, y));
    points.push({ x, y });
  }

  let pathD = `M ${points[0].x} ${points[0].y}`;
  for (let i = 1; i < points.length; i++) {
    pathD += ` L ${points[i].x} ${points[i].y}`;
  }

  // Opacity depends on FLT state
  const strokeOpacity = fltActive ? 0.7 : 0.12;
  const fillOpacity = fltActive ? 0.20 : 0.04;
  const handleOpacity = fltActive ? 1.0 : 0.15;

  const fillD = pathD + ` L ${points[points.length - 1].x} ${h} L ${points[0].x} ${h} Z`;
  svgContent += `<path d="${fillD}" fill="oklch(55% 0.18 290 / ${fillOpacity})" stroke="none"/>`;
  svgContent += `<path d="${pathD}" fill="none" stroke="oklch(55% 0.18 290 / ${strokeOpacity})" stroke-width="1.5" stroke-linejoin="round"/>`;

  // HP handle — filled circle
  const hpHandleX = freqToX(hpFreq * 1.5);
  const hpHandleY = passY + 10;
  svgContent += `<circle cx="${hpHandleX}" cy="${hpHandleY}" r="4" fill="oklch(55% 0.18 290 / ${handleOpacity})" stroke="oklch(55% 0.18 290 / ${handleOpacity * 0.4})" stroke-width="1"/>`;

  // LP handle — outlined circle
  const lpHandleX = freqToX(lpFreq * 0.75);
  const lpHandleY = passY + 10;
  svgContent += `<circle cx="${lpHandleX}" cy="${lpHandleY}" r="4" fill="none" stroke="oklch(55% 0.18 290 / ${handleOpacity})" stroke-width="1.5"/>`;

  svg.innerHTML = svgContent;

  // Update readout class
  const readout = document.getElementById('filterReadout');
  readout.className = fltActive ? 'filter-readout active' : 'filter-readout inactive';
}

// ================================================================
// TIME/SYNC — Single Toggle Button + Always-Visible Dropdowns
// ================================================================
const timeSyncToggle = document.getElementById('timeSyncToggle');
const syncDropdowns = document.getElementById('syncDropdowns');

function updateTimeSyncUI() {
  if (syncMode) {
    timeSyncToggle.className = 'time-sync-toggle mode-sync';
    timeSyncToggle.textContent = 'Sync';
    syncDropdowns.classList.remove('disabled');
    const timeKnobValue = delayRow1.querySelectorAll('.knob-value')[1];
    if (timeKnobValue) timeKnobValue.textContent = '1/4';
  } else {
    timeSyncToggle.className = 'time-sync-toggle mode-time';
    timeSyncToggle.textContent = 'Time';
    syncDropdowns.classList.add('disabled');
    const timeKnobValue = delayRow1.querySelectorAll('.knob-value')[1];
    if (timeKnobValue) timeKnobValue.textContent = '500 ms';
  }
}

timeSyncToggle.addEventListener('click', () => {
  syncMode = !syncMode;
  updateTimeSyncUI();
});

// ================================================================
// FLT Toggle — Dims/brightens filter graph (always visible)
// ================================================================
document.getElementById('fltToggle').addEventListener('click', function() {
  fltActive = !fltActive;
  this.classList.toggle('active', fltActive);
  renderFilterGraph();
});

// ================================================================
// Header toggles — AIR and OSC
// ================================================================
document.getElementById('airHeaderToggle').addEventListener('click', function() {
  this.classList.toggle('active-stellar');
});

document.getElementById('oscHeaderToggle').addEventListener('click', function() {
  this.classList.toggle('active-green');
});

// ================================================================
// OSC Receive/Send toggles (independent)
// ================================================================
document.getElementById('oscReceiveToggle').addEventListener('click', function() {
  this.classList.toggle('active');
});
document.getElementById('oscSendToggle').addEventListener('click', function() {
  this.classList.toggle('active');
});

// ================================================================
// Bottom Panel — Tabs
// ================================================================
function initTabs() {
  const tabs = document.querySelectorAll('.bottom-tab');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      activeTab = tab.dataset.tab;
      updateTabs();
      renderObjectControls();
    });
  });
  updateTabs();
}

function updateTabs() {
  const tabs = document.querySelectorAll('.bottom-tab');
  const color = TAP_COLORS[selectedTap];
  tabs.forEach(tab => {
    const isActive = (tab.dataset.tab === activeTab);
    tab.style.color = isActive ? 'var(--text-secondary)' : '';
    tab.style.borderBottomColor = isActive ? color : 'transparent';
    tab.style.background = isActive ? colorWithAlpha(color, 0.05) : '';
  });

  document.getElementById('tabPosition').classList.toggle('active', activeTab === 'position');
  document.getElementById('tabDSP').classList.toggle('active', activeTab === 'dsp');
  document.getElementById('tabMotion').classList.toggle('active', activeTab === 'motion');
}

// ================================================================
// Bottom Panel — Tap Selector + Per-Tap Controls
// ================================================================
function renderObjectSelector() {
  const container = document.getElementById('objectSelector');
  container.innerHTML = '';
  for (let i = 0; i < 12; i++) {
    const btn = document.createElement('button');
    btn.className = 'obj-btn';
    btn.textContent = i + 1;
    btn.dataset.index = i;
    applyObjBtnStyle(btn, i);
    btn.addEventListener('click', () => selectTap(i));
    container.appendChild(btn);
  }
}

// 4-state button styles
function applyObjBtnStyle(btn, i) {
  const tap = TAPS[i];
  const color = TAP_COLORS[i];
  const isSelected = (i === selectedTap);
  const isEnabled = tap.enabled;

  btn.style.background = '';
  btn.style.borderColor = '';
  btn.style.color = '';
  btn.style.fontWeight = '';
  btn.style.boxShadow = '';

  if (!isEnabled && !isSelected) {
    btn.style.background = 'var(--bg-recessed)';
    btn.style.borderColor = 'var(--border-dim)';
    btn.style.color = 'var(--text-dim)';
  } else if (!isEnabled && isSelected) {
    btn.style.background = 'var(--bg-recessed)';
    btn.style.borderColor = color;
    btn.style.color = color;
    btn.style.fontWeight = '600';
  } else if (isEnabled && !isSelected) {
    btn.style.background = colorWithAlpha(color, 0.25);
    btn.style.borderColor = colorWithAlpha(color, 0.4);
    btn.style.color = color;
  } else {
    btn.style.background = colorWithAlpha(color, 0.4);
    btn.style.borderColor = color;
    btn.style.color = 'oklch(92% 0.008 260)';
    btn.style.fontWeight = '600';
    btn.style.boxShadow = `0 0 8px ${colorWithAlpha(color, 0.25)}`;
  }
}

function colorWithAlpha(hslColor, alpha) {
  return hslColor.replace('hsl(', 'hsla(').replace(')', `, ${alpha})`);
}

function selectTap(index) {
  selectedTap = index;
  document.querySelectorAll('.obj-btn').forEach((btn, i) => {
    applyObjBtnStyle(btn, i);
  });
  document.querySelectorAll('.tap-dot').forEach((dot) => {
    dot.classList.toggle('selected', parseInt(dot.dataset.index) === index);
  });
  updateTabs();
  renderObjectControls();
}

function renderObjectControls() {
  // Clear all tab contents
  const posTab = document.getElementById('tabPosition');
  const dspTab = document.getElementById('tabDSP');
  const motionTab = document.getElementById('tabMotion');
  posTab.innerHTML = '';
  dspTab.innerHTML = '';
  motionTab.innerHTML = '';

  const tap = TAPS[selectedTap];
  const color = TAP_COLORS[selectedTap];

  // ---- POSITION TAB ----
  {
    // ON/OFF
    const onOff = document.createElement('div');
    onOff.className = 'obj-control';
    onOff.style.width = '52px';
    const onOffBtn = document.createElement('div');
    onOffBtn.className = 'obj-on-off';
    onOffBtn.id = 'onOffBtn';
    onOffBtn.textContent = tap.enabled ? 'ON' : 'OFF';
    if (tap.enabled) {
      onOffBtn.style.background = colorWithAlpha(color, 0.15);
      onOffBtn.style.borderColor = color;
      onOffBtn.style.color = color;
      onOffBtn.style.boxShadow = `0 0 6px ${colorWithAlpha(color, 0.2)}`;
    }
    onOff.appendChild(onOffBtn);
    posTab.appendChild(onOff);

    let azDisplay = tap.az;
    if (azDisplay > 180) azDisplay = azDisplay - 360;

    addKnobToContainer(posTab, 'Azimuth', (tap.az % 360) / 360, azDisplay + '\u00B0', 86, color);
    addKnobToContainer(posTab, 'Elevation', 0.5 + ((tap.elev || 0) / 180), (tap.elev >= 0 ? '+' : '') + (tap.elev || 0) + '\u00B0', 86, color, { bipolar: true });
    addKnobToContainer(posTab, 'Distance', tap.dist, tap.dist.toFixed(2), 86, color);
  }

  // ---- DSP TAB ----
  {
    addKnobToContainer(dspTab, 'HP', 0.05, '20 Hz', 72, color);
    addKnobToContainer(dspTab, 'LP', 0.95, '18 kHz', 72, color);
    addKnobToContainer(dspTab, 'Pitch', 0.5, '0 st', 72, color, { bipolar: true });

    // CUM/OVR toggle
    const cumCtrl = document.createElement('div');
    cumCtrl.className = 'obj-control';
    cumCtrl.style.width = '44px';
    cumCtrl.innerHTML = `
      <div class="obj-control-label" style="visibility:hidden;">Mode</div>
      <div class="cum-ovr-toggle" id="cumOvrToggle" style="border-color: ${colorWithAlpha(color, 0.3)}; color: ${color};">Cum</div>`;
    dspTab.appendChild(cumCtrl);

    addKnobToContainer(dspTab, 'Doppler', 0, '0%', 72, color);
  }

  // ---- MOTION TAB ----
  {
    const motionWrap = document.createElement('div');
    motionWrap.className = 'motion-controls';

    const trajCtrl = document.createElement('div');
    trajCtrl.className = 'obj-control';
    trajCtrl.style.width = '100px';
    trajCtrl.innerHTML = `
      <div class="obj-control-label">Trajectory</div>
      <select class="traj-dropdown" style="border-color: ${colorWithAlpha(color, 0.3)}; color: ${color};">
        <option>None</option><option>Spiral</option><option>Orbit</option>
        <option>Bounce</option><option>Figure-8</option><option>Random</option>
      </select>`;
    motionWrap.appendChild(trajCtrl);

    addKnobToContainer(motionWrap, 'Speed', 0.25, '1.00', 72, color);
    motionTab.appendChild(motionWrap);
  }
}

function addKnobToContainer(container, labelText, value, displayVal, width, color, opts = {}) {
  const ctrl = document.createElement('div');
  ctrl.className = 'obj-control';
  ctrl.style.width = width + 'px';
  ctrl.innerHTML = `
    <div class="obj-control-label">${labelText}</div>
    <div class="obj-knob-visual">${createSmallKnobSVG({ value, color, isBipolar: opts.bipolar || false })}</div>
    <div class="obj-knob-value">${displayVal}</div>`;
  container.appendChild(ctrl);
}

renderObjectSelector();
renderObjectControls();
initTabs();

// ================================================================
// Spatial Map Canvas — Darker void background (v4)
// ================================================================
function renderMapCanvas() {
  const canvas = document.getElementById('mapCanvas');
  const container = canvas.parentElement;
  const rect = container.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const w = rect.width, h = rect.height;
  const cx = w / 2, cy = h / 2;

  // Deeper void gradient — darker than v3
  const vg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.7);
  vg.addColorStop(0, '#08080f');
  vg.addColorStop(0.3, '#070710');
  vg.addColorStop(0.6, '#060609');
  vg.addColorStop(1, '#050507');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, w, h);

  // Nebula washes — reduced opacity (~30% less than v3)
  const n1 = ctx.createRadialGradient(cx * 0.65, cy * 0.55, 0, cx * 0.65, cy * 0.55, w * 0.45);
  n1.addColorStop(0, 'rgba(55, 25, 85, 0.038)');
  n1.addColorStop(0.5, 'rgba(30, 18, 65, 0.017)');
  n1.addColorStop(1, 'transparent');
  ctx.fillStyle = n1;
  ctx.fillRect(0, 0, w, h);

  const n2 = ctx.createRadialGradient(cx * 1.4, cy * 1.35, 0, cx * 1.4, cy * 1.35, w * 0.35);
  n2.addColorStop(0, 'rgba(25, 45, 75, 0.028)');
  n2.addColorStop(0.5, 'rgba(18, 32, 55, 0.014)');
  n2.addColorStop(1, 'transparent');
  ctx.fillStyle = n2;
  ctx.fillRect(0, 0, w, h);

  const n3 = ctx.createRadialGradient(cx * 1.1, cy * 0.4, 0, cx * 1.1, cy * 0.4, w * 0.25);
  n3.addColorStop(0, 'rgba(80, 50, 30, 0.014)');
  n3.addColorStop(1, 'transparent');
  ctx.fillStyle = n3;
  ctx.fillRect(0, 0, w, h);

  // Vignette
  const vig = ctx.createRadialGradient(cx, cy, w * 0.15, cx, cy, Math.max(w, h) * 0.65);
  vig.addColorStop(0, 'transparent');
  vig.addColorStop(1, 'rgba(0, 0, 0, 0.4)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, w, h);
}

// ================================================================
// Spatial Map SVG Overlay
// ================================================================
function renderMapOverlay() {
  const svg = document.getElementById('mapOverlay');
  const container = svg.parentElement;
  const rect = container.getBoundingClientRect();
  const w = rect.width, h = rect.height;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  const cx = w / 2, cy = h / 2;
  const maxR = Math.min(w, h) * 0.45;

  const ringC = 'rgba(100, 130, 160, 0.12)';
  const crossC = 'rgba(80, 110, 140, 0.07)';
  const retC = 'rgba(160, 190, 220, 0.22)';

  let s = `
    <defs>
      <filter id="rglow" x="-10%" y="-10%" width="120%" height="120%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <line x1="0" y1="${cy}" x2="${w}" y2="${cy}" stroke="${crossC}" stroke-width="0.4" stroke-dasharray="2 6"/>
    <line x1="${cx}" y1="0" x2="${cx}" y2="${h}" stroke="${crossC}" stroke-width="0.4" stroke-dasharray="2 6"/>
    <line x1="${cx - maxR * 0.707}" y1="${cy - maxR * 0.707}" x2="${cx + maxR * 0.707}" y2="${cy + maxR * 0.707}" stroke="${crossC}" stroke-width="0.25" stroke-dasharray="1 8" opacity="0.5"/>
    <line x1="${cx + maxR * 0.707}" y1="${cy - maxR * 0.707}" x2="${cx - maxR * 0.707}" y2="${cy + maxR * 0.707}" stroke="${crossC}" stroke-width="0.25" stroke-dasharray="1 8" opacity="0.5"/>`;

  [0.25, 0.50, 0.75, 1.00].forEach(r => {
    s += `<circle cx="${cx}" cy="${cy}" r="${r * maxR}" fill="none" stroke="${ringC}" stroke-width="0.5" filter="url(#rglow)"/>`;
  });

  // Reticle
  const rr = 7;
  s += `
    <circle cx="${cx}" cy="${cy}" r="${rr}" fill="none" stroke="${retC}" stroke-width="0.5"/>
    <circle cx="${cx}" cy="${cy}" r="1.3" fill="${retC}"/>
    <line x1="${cx}" y1="${cy - rr - 2}" x2="${cx}" y2="${cy - rr - 10}" stroke="${retC}" stroke-width="0.4"/>
    <line x1="${cx}" y1="${cy + rr + 2}" x2="${cx}" y2="${cy + rr + 10}" stroke="${retC}" stroke-width="0.4"/>
    <line x1="${cx - rr - 2}" y1="${cy}" x2="${cx - rr - 10}" y2="${cy}" stroke="${retC}" stroke-width="0.4"/>
    <line x1="${cx + rr + 2}" y1="${cy}" x2="${cx + rr + 10}" y2="${cy}" stroke="${retC}" stroke-width="0.4"/>
    <line x1="${cx - rr}" y1="${cy - 1.2}" x2="${cx - rr}" y2="${cy + 1.2}" stroke="${retC}" stroke-width="0.4"/>
    <line x1="${cx + rr}" y1="${cy - 1.2}" x2="${cx + rr}" y2="${cy + 1.2}" stroke="${retC}" stroke-width="0.4"/>
    <line x1="${cx - 1.2}" y1="${cy - rr}" x2="${cx + 1.2}" y2="${cy - rr}" stroke="${retC}" stroke-width="0.4"/>
    <line x1="${cx - 1.2}" y1="${cy + rr}" x2="${cx + 1.2}" y2="${cy + rr}" stroke="${retC}" stroke-width="0.4"/>`;

  svg.innerHTML = s;

  // Cardinals
  document.getElementById('cardF').style.cssText = `top: ${cy - maxR - 20}px; left: ${cx}px; transform: translateX(-50%);`;
  document.getElementById('cardB').style.cssText = `top: ${cy + maxR + 6}px; left: ${cx}px; transform: translateX(-50%);`;
  document.getElementById('cardL').style.cssText = `top: ${cy}px; left: ${cx - maxR - 16}px; transform: translateY(-50%);`;
  document.getElementById('cardR').style.cssText = `top: ${cy}px; left: ${cx + maxR + 6}px; transform: translateY(-50%);`;

  // Ring labels — along 30 degree diagonal
  [0.25, 0.50, 0.75, 1.00].forEach(r => {
    const label = document.getElementById('ringLabel' + String(Math.round(r * 100)).padStart(3, '0'));
    label.textContent = r.toFixed(2);
    const ang = 30 * Math.PI / 180;
    const lx = cx + Math.cos(ang) * r * maxR + 3;
    const ly = cy + Math.sin(ang) * r * maxR + 2;
    label.style.cssText = `top: ${ly}px; left: ${lx}px; opacity: 0.5;`;
  });
}

// ================================================================
// Stars — CSS seamless tiled drift (2x2 tiled pattern)
// ================================================================
function createStars() {
  const container = document.getElementById('starField');
  container.innerHTML = '';
  const mapContainer = document.getElementById('spatialMap');
  const rect = mapContainer.getBoundingClientRect();
  const mapW = rect.width;
  const mapH = rect.height;

  // Generate ~50 stars in the base quadrant (top-left, same size as visible area)
  const baseStars = [];
  for (let i = 0; i < 50; i++) {
    const sz = Math.random() < 0.12 ? 2 : 1;
    const dur = 3 + Math.random() * 6;
    const del = Math.random() * 5;
    const anim = ['twinkle', 'twinkle-slow', 'twinkle-fast'][Math.floor(Math.random() * 3)];
    const opacity = 0.08 + Math.random() * 0.42; // 0.08 to 0.50

    let bg = 'oklch(90% 0.02 240)';
    if (Math.random() < 0.18) bg = 'oklch(85% 0.05 70)';
    else if (Math.random() < 0.14) bg = 'oklch(80% 0.06 290)';

    const x = Math.random() * mapW;
    const y = Math.random() * mapH;

    baseStars.push({ x, y, sz, bg, dur, del, anim, opacity });
  }

  // Clone into 4 quadrants for seamless 2x2 tiling
  const offsets = [
    [0, 0],
    [mapW, 0],
    [0, mapH],
    [mapW, mapH]
  ];

  for (const [ox, oy] of offsets) {
    for (const s of baseStars) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.cssText = `
        width: ${s.sz}px; height: ${s.sz}px;
        background: ${s.bg};
        left: ${s.x + ox}px; top: ${s.y + oy}px;
        opacity: ${s.opacity};
        animation: ${s.anim} ${s.dur}s ${s.del}s ease-in-out infinite;`;
      container.appendChild(star);
    }
  }
}

// ================================================================
// Tap Dots — Elevation visual encoding (NO dashed rings) + sequential pulse
// ================================================================
function spatialToPixel(azDeg, dist) {
  const container = document.getElementById('spatialMap');
  const rect = container.getBoundingClientRect();
  const cx = rect.width / 2, cy = rect.height / 2;
  const maxR = Math.min(rect.width, rect.height) * 0.45;
  const rad = azDeg * Math.PI / 180;
  return { x: cx - Math.sin(rad) * dist * maxR, y: cy - Math.cos(rad) * dist * maxR };
}

function getElevationVisuals(elev) {
  // Elevation encoding:
  // Positive: brighter, larger (+2px per 15deg), bolder glow, solid ring
  // Negative: dimmer (55% opacity), smaller (-1px per 10deg), reduced glow, solid ring at reduced opacity
  // Zero: standard 14px
  const absElev = Math.abs(elev);
  const isPositive = elev > 0;
  const isNegative = elev < 0;

  let coreSize, glowSize, coreOpacity, glowIntensity, ringOpacity;

  if (isPositive) {
    const sizeBoost = Math.floor(absElev / 15) * 2;
    coreSize = 14 + sizeBoost;
    glowSize = 32 + sizeBoost * 2;
    coreOpacity = 1.0;
    glowIntensity = 0.45 + (absElev / 90) * 0.25;
    ringOpacity = 0.5;
  } else if (isNegative) {
    const sizeReduction = Math.floor(absElev / 10) * 1;
    coreSize = Math.max(10, 14 - sizeReduction);
    glowSize = Math.max(22, 32 - sizeReduction * 2);
    coreOpacity = 0.55;
    glowIntensity = 0.2;
    ringOpacity = 0.2;
  } else {
    coreSize = 14;
    glowSize = 32;
    coreOpacity = 0.8;
    glowIntensity = 0.4;
    ringOpacity = 0.3;
  }

  return { coreSize, glowSize, coreOpacity, glowIntensity, ringOpacity };
}

function renderTapDots() {
  const container = document.getElementById('tapDots');
  container.innerHTML = '';
  let enabledIndex = 0;

  TAPS.forEach((tap, i) => {
    if (!tap.enabled) return;
    const pos = spatialToPixel(tap.az, tap.dist);
    const color = TAP_COLORS[i];
    const elev = tap.elev || 0;
    const ev = getElevationVisuals(elev);
    const dot = document.createElement('div');
    dot.className = `tap-dot ${i === selectedTap ? 'selected' : ''}`;
    dot.style.left = pos.x + 'px';
    dot.style.top = pos.y + 'px';
    dot.style.color = color;
    dot.dataset.index = i;

    // Tooltip: Az + El
    let azD = tap.az; if (azD > 180) azD -= 360;

    // Pulse delay: sequential stagger ~0.6s each
    const pulseDelay = enabledIndex * 0.6;

    // Ring — always solid, opacity varies by elevation
    const ringSize = ev.coreSize + 6;
    const ringBorder = `1px solid ${colorWithAlpha(color, ev.ringOpacity)}`;

    const selectedExtra = (i === selectedTap) ? ev.coreSize + 2 : ev.coreSize;

    dot.innerHTML = `
      <div class="tap-dot-glow" style="width:${ev.glowSize}px; height:${ev.glowSize}px; background:radial-gradient(circle,${colorWithAlpha(color, ev.glowIntensity)} 0%,${colorWithAlpha(color, ev.glowIntensity * 0.4)} 40%,transparent 70%); opacity:${ev.glowIntensity};"></div>
      <div class="tap-dot-ring" style="width:${ringSize}px; height:${ringSize}px; border:${ringBorder}; border-radius:50%;"></div>
      <div class="tap-pulse-ring" style="animation-delay: ${pulseDelay}s; border-color: ${color}; width:${ev.coreSize}px; height:${ev.coreSize}px;"></div>
      <div class="tap-dot-core tap-core-pulse" style="width:${selectedExtra}px; height:${selectedExtra}px; background:${color}; opacity:${ev.coreOpacity}; box-shadow:0 0 ${ev.glowIntensity * 16}px ${colorWithAlpha(color, ev.glowIntensity * 0.6)},0 0 ${ev.glowIntensity * 28}px ${colorWithAlpha(color, ev.glowIntensity * 0.3)}; animation-delay: ${pulseDelay}s;">
        <span>${tap.id}</span>
      </div>
      <div class="tap-tooltip">Az ${azD}\u00B0 \u00B7 El ${elev >= 0 ? '+' : ''}${elev}\u00B0</div>`;
    dot.addEventListener('click', () => selectTap(i));
    container.appendChild(dot);
    enabledIndex++;
  });
}

// ================================================================
// Toggle ON/OFF via delegated click
// ================================================================
document.addEventListener('click', function(e) {
  const btn = e.target.closest('#onOffBtn');
  if (!btn) return;
  const tap = TAPS[selectedTap];
  const color = TAP_COLORS[selectedTap];
  tap.enabled = !tap.enabled;
  btn.textContent = tap.enabled ? 'ON' : 'OFF';
  if (tap.enabled) {
    btn.style.background = colorWithAlpha(color, 0.15);
    btn.style.borderColor = color;
    btn.style.color = color;
    btn.style.boxShadow = `0 0 6px ${colorWithAlpha(color, 0.2)}`;
  } else {
    btn.style.background = '';
    btn.style.borderColor = '';
    btn.style.color = '';
    btn.style.boxShadow = '';
  }
  document.querySelectorAll('.obj-btn').forEach((b, i) => applyObjBtnStyle(b, i));
  renderTapDots();
});

// CUM/OVR toggle via delegated click
document.addEventListener('click', function(e) {
  const toggle = e.target.closest('#cumOvrToggle');
  if (!toggle) return;
  toggle.textContent = toggle.textContent === 'Cum' ? 'Ovr' : 'Cum';
});

// ================================================================
// Init
// ================================================================
function init() {
  renderMapCanvas();
  renderMapOverlay();
  createStars();
  renderTapDots();
  renderFilterGraph();
}

window.addEventListener('resize', () => {
  init();
});
init();
</script>
